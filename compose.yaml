services:
  app1:
    build: ./app
    image: minha-app
    hostname: app1
  app2:
    build: ./app
    image: minha-app
    hostname: app2
  app3:
    build: ./app
    image: minha-app
    hostname: app3

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
    depends_on:
      - app1
      - app2
      - app3
